server {
    listen 80;
    server_name freelance.koushikpanda.online;

    # Let's Encrypt HTTP-01 challenge - must stay reachable over plain HTTP for renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name freelance.koushikpanda.online;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/freelance.koushikpanda.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freelance.koushikpanda.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same-origin API calls, proxied to the backend container on the Docker network.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback so client-side routes (e.g. /admin/master) survive a refresh.
    location / {
        try_files $uri /index.html;
    }
}
